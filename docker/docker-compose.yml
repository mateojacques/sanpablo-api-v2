services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sanpablo-postgres
    environment:
      POSTGRES_USER: sanpablo
      POSTGRES_PASSWORD: sanpablo
      POSTGRES_DB: sanpablo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sanpablo']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: sanpablo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack for AWS services (S3, SQS, SES)
  localstack:
    image: localstack/localstack:3.0
    container_name: sanpablo-localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3,sqs,ses
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Import Worker - Processes CSV import jobs from SQS
  import-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: sanpablo-import-worker
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sanpablo:sanpablo@postgres:5432/sanpablo
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: sanpablo-assets
      SQS_IMPORT_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/sanpablo-import
      SES_FROM_EMAIL: pedidos@tutienda.com
      OWNER_EMAIL: owner@example.com
      OWNER_WHATSAPP: +5491155551234
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  localstack_data:
